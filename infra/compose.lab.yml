name: folio_lab
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://folio_lab:${FOLIO_DB_PASSWORD:?Required lab-only password}@postgres:5432/folio_lab
      HOST: 0.0.0.0
      PORT: 3100
      NODE_ENV: development
    ports:
      - "127.0.0.1:${FOLIO_API_PORT:-3310}:3100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - folio_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  worker:
    profiles: ["jobs"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@folio/worker", "exec", "node", "dist/main.js"]
    environment:
      DATABASE_URL: postgresql://folio_lab:${FOLIO_DB_PASSWORD:?Required lab-only password}@postgres:5432/folio_lab
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - folio_private
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: folio_lab
      POSTGRES_USER: folio_lab
      POSTGRES_PASSWORD: ${FOLIO_DB_PASSWORD:?Required lab-only password}
    ports:
      - "127.0.0.1:${FOLIO_DB_PORT:-55432}:5432"
    volumes:
      - folio_postgres_data:/var/lib/postgresql/data
    networks:
      - folio_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio_lab -d folio_lab"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
networks:
  folio_private:
    name: folio_lab_private
volumes:
  folio_postgres_data:
    name: folio_lab_postgres_data
