name: Temporary Folio Audit Lockfile Refresh
on:
  push:
    branches: [fix/7-dependency-release-audit]
permissions:
  contents: write
jobs:
  regenerate-lock:
    if: github.repository == 'VOX-Medya/folio' && github.ref == 'refs/heads/fix/7-dependency-release-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --no-frozen-lockfile
      - name: Verify dependency resolution and Drizzle command availability
        run: |
          pnpm metro:security-check
          pnpm --filter @folio/db exec drizzle-kit --version
          echo 'Old abandoned Drizzle loader nodes:'
          grep -E '^  (@esbuild-kit/(esm-loader|core-utils)|esbuild@0[.]18[.]20|js-yaml@5[.]3[.]0)@?' pnpm-lock.yaml && exit 1 || true
      - name: Report current remaining advisories without disguising release block
        run: |
          pnpm audit --json > /tmp/folio-pr-audit.json || true
          node -e 'const a=require("/tmp/folio-pr-audit.json"); console.log("Remaining audit counts:",JSON.stringify(a.metadata?.vulnerabilities))'
      - name: Commit new resolved lockfile and remove this one-use workflow
        run: |
          rm .github/workflows/_folio-security-refresh-temp.yml
          git add pnpm-lock.yaml .github/workflows/_folio-security-refresh-temp.yml
          git -c user.name='folio-ci' -c user.email='folio-ci@users.noreply.github.com' commit -m 'chore(#7): regenerate constrained pnpm lockfile without legacy loader'
          git push origin HEAD:refs/heads/fix/7-dependency-release-audit
