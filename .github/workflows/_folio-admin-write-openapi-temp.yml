# Temporary branch-only generator, removes itself in the same commit.
# No production build or secrets. Never merge into main.
name: Temporary Folio Admin Write OpenAPI Refresh
on:
  push:
    branches: [feat/9-admin-catalog-atomic-draft-write]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'VOX-Medya/folio' && github.ref == 'refs/heads/feat/9-admin-catalog-atomic-draft-write'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/contracts build
      - run: pnpm --filter @folio/db build
      - run: pnpm --filter @folio/server typecheck
      - run: pnpm --filter @folio/server openapi:write
      - name: Commit generated snapshot and erase one-time workflow
        run: |
          rm .github/workflows/_folio-admin-write-openapi-temp.yml
          git add docs/api/openapi.v1.json .github/workflows/_folio-admin-write-openapi-temp.yml
          git -c user.name='folio-ci' -c user.email='folio-ci@users.noreply.github.com' commit -m 'chore(#9): update admin draft write OpenAPI contract'
          git push origin HEAD:refs/heads/feat/9-admin-catalog-atomic-draft-write
