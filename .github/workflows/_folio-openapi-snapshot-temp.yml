# TEMPORARY branch-only generator. It deletes itself before the only commit.
# Never merge this workflow into main. No secrets or deployment.
name: Temporary Folio OpenAPI snapshot refresh
on:
  push:
    branches:
      - feat/9-admin-catalog-read-only-search
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'VOX-Medya/folio' && github.ref == 'refs/heads/feat/9-admin-catalog-read-only-search'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/contracts build
      - run: pnpm --filter @folio/db build
      - run: pnpm --filter @folio/server typecheck
      - run: pnpm --filter @folio/server openapi:write
      - name: Commit only generated schema and remove this workflow
        run: |
          rm .github/workflows/_folio-openapi-snapshot-temp.yml
          git add docs/api/openapi.v1.json .github/workflows/_folio-openapi-snapshot-temp.yml
          git -c user.name='folio-ci' -c user.email='folio-ci@users.noreply.github.com' commit -m 'chore(#9): snapshot reviewed admin catalog REST schema'
          git push origin HEAD:refs/heads/feat/9-admin-catalog-read-only-search
