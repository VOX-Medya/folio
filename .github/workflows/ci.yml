name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: folio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fast type, lint, unit and OpenAPI contract checks
        run: |
          pnpm --filter @folio/contracts build
          pnpm --filter @folio/db build
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter @folio/server openapi:check
          pnpm metro:security-check
          pnpm dependency:hardening-check

  full-regression:
    name: full-regression
    # Heavy checks stay intact. Run on main, nightly, manual, or explicit PR label.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Isolated Folio PostgreSQL and durable-job integration tests
        run: |
          bash infra/lab.sh db-up
          bash infra/lab.sh migrate
          bash infra/lab.sh migrate
          bash infra/lab.sh test-db
          bash infra/lab.sh catalog-smoke
          bash infra/lab.sh content-smoke
          bash infra/lab.sh rights-smoke
          bash infra/lab.sh translation-smoke
          bash infra/lab.sh audio-smoke
          bash infra/lab.sh job-smoke
          bash infra/lab.sh import-smoke
          bash infra/lab.sh storage-quota-smoke
          bash infra/lab.sh storage-integrity-smoke
          bash infra/lab.sh storage-malware-smoke
          bash infra/lab.sh storage-epub-smoke
          bash infra/lab.sh storage-ogg-smoke
          bash infra/lab.sh storage-m4a-smoke
          bash infra/lab.sh auth-smoke
          bash infra/lab.sh admin-rbac-smoke
          bash infra/lab.sh admin-totp-smoke
          bash infra/lab.sh admin-totp-rotation-smoke
          bash infra/lab.sh admin-mfa-recovery-smoke
          bash infra/lab.sh admin-role-lifecycle-smoke
          bash infra/lab.sh session-cap-smoke
          bash infra/lab.sh auth-rate-smoke
          bash infra/lab.sh auth-http-smoke
          bash infra/lab.sh auth-admission-http-smoke
          bash infra/lab.sh web-cookie-https-smoke
          bash infra/lab.sh web-auth-https-smoke
          bash infra/lab.sh web-self-https-smoke
          bash infra/lab.sh admin-totp-https-smoke
          bash infra/lab.sh admin-catalog-https-smoke
          bash infra/lab.sh onboarding-smoke
          bash infra/lab.sh onboarding-http-smoke
          bash infra/lab.sh device-sessions-http-smoke
      - name: Preserve synthetic live catalog responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-catalog-live-visual-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Folio CI laboratory
        if: always()
        run: |
          if test -f infra/.env.lab; then bash infra/lab.sh down; fi
      - name: Export all Expo JavaScript targets (web/Android/iOS)
        run: pnpm mobile:export
      - name: Validate CI bundle checker negative cases
        run: pnpm ci:contract-test
      - run: pnpm licenses list --json > licenses.json && node tools/security/check-licenses.mjs licenses.json
      - run: pnpm e2e
      - name: Preserve failed browser test diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folio-browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build local Docker image (no deployment)
        run: docker build --file infra/Dockerfile --tag folio-ci:local .
      - name: Dependency evidence and release readiness (informational; no deploy)
        continue-on-error: true
        run: |
          pnpm audit --json > dependency-audit.json || true
          pnpm security:release-check

  clamav-native-protocol:
    name: ClamAV stdin protocol (synthetic signatures only; not a release gate)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - name: Install ClamAV executable in ephemeral Ubuntu test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav
          /usr/bin/clamscan --version
      - name: Test real ClamAV engine using synthetic local hash signatures
        env:
          FOLIO_CLAMAV_TEST_MODE: synthetic-only
        run: pnpm --filter @folio/db db:clamav-native-smoke
