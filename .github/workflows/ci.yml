name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Isolated Folio PostgreSQL and durable-job integration tests
        run: |
          bash infra/lab.sh db-up
          bash infra/lab.sh migrate
          bash infra/lab.sh migrate
          bash infra/lab.sh test-db
          bash infra/lab.sh catalog-smoke
          bash infra/lab.sh content-smoke
          bash infra/lab.sh rights-smoke
          bash infra/lab.sh translation-smoke
          bash infra/lab.sh audio-smoke
          bash infra/lab.sh job-smoke
          bash infra/lab.sh import-smoke
          bash infra/lab.sh storage-quota-smoke
          bash infra/lab.sh auth-smoke
          bash infra/lab.sh auth-rate-smoke
          bash infra/lab.sh auth-http-smoke
          bash infra/lab.sh onboarding-smoke
      - name: Stop isolated Folio CI laboratory
        if: always()
        run: |
          if test -f infra/.env.lab; then bash infra/lab.sh down; fi
      - name: Export all Expo JavaScript targets (web/Android/iOS)
        run: pnpm mobile:export
      - name: Validate CI bundle checker negative cases
        run: pnpm ci:contract-test
      - run: pnpm licenses list --json > licenses.json && node tools/security/check-licenses.mjs licenses.json
      - run: pnpm e2e
      - name: Preserve failed browser test diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folio-browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build local Docker image (no deployment)
        run: docker build --file infra/Dockerfile --tag folio-ci:local .
      - name: Dependency audit (pre-release informational)
        continue-on-error: true
        run: pnpm audit --audit-level high
